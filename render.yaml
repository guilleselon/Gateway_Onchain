# render.yaml
#
# Render Blueprint for the Onchain Gateway.
#
# Resources:
#   1. gateway-app     — Web Service (API + dashboard + public payment UI)
#   2. gateway-worker  — Web Service that wraps the worker threads
#                        (workaround: Render free tier has no background workers)
#   3. gateway-db      — PostgreSQL database
#
# Variables marked with `sync: false` are NOT stored in this file.
# You will be prompted to enter them once in the Render dashboard.
#
# Variables marked with `fromDatabase` are injected automatically by Render
# from the linked PostgreSQL instance.
#
# IMPORTANT for the worker:
#   On the free tier, Web Services sleep after 15 minutes of inactivity.
#   To keep the worker alive, ping its /health endpoint every 5 minutes
#   from an external service (cron-job.org, UptimeRobot, etc.).
#
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Web Service: API, dashboard, public payment UI.
  # ---------------------------------------------------------------------------
  - type: web
    name: gateway-app
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Database (injected by Render from the linked Postgres)
      - key: DATABASE_URL
        fromDatabase:
          name: gateway-db
          property: connectionString

      # Network
      - key: RPC_URL
        sync: false
      - key: CHAIN_ID
        value: "10143"
      - key: CHAIN_NAME
        value: "monad-testnet"
      - key: CHAIN_EXPLORER
        value: "https://testnet.monadvision.com"
      - key: CHAIN_CONFIRMATIONS
        value: "1"

      # Contracts (from scripts/deploy_contracts.py)
      - key: FACTORY_ADDRESS
        sync: false
      - key: MASTER_ADDRESS
        sync: false

      # Gateway wallet (pays gas to deploy each proxy)
      - key: PRIVATE_KEY
        sync: false

      # Sessions
      - key: SESSION_SECRET
        sync: false

      # Quotas and limits
      - key: DAILY_DEPLOY_QUOTA
        value: "100"
      - key: MIN_GATEWAY_BALANCE_WEI
        value: "50000000000000000"

      # CoinGecko (optional)
      - key: COINGECKO_API_KEY
        sync: false

      # Python and logging
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LOG_LEVEL
        value: "INFO"

  # ---------------------------------------------------------------------------
  # Worker wrapped as a Web Service.
  #
  # The worker runs its four threads (polling, deploy, webhooks, rates) in
  # the background. The HTTP server only answers /health and / to satisfy
  # Render's health checks.
  #
  # IMPORTANT: On the free tier, this service sleeps after 15 minutes of
  # inactivity. Ping /health every 5 minutes to keep it awake.
  # ---------------------------------------------------------------------------
  - type: web
    name: gateway-worker
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.worker.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Same database as the web service.
      - key: DATABASE_URL
        fromDatabase:
          name: gateway-db
          property: connectionString

      # Network (same values as the web service).
      - key: RPC_URL
        sync: false
      - key: CHAIN_ID
        value: "10143"
      - key: CHAIN_NAME
        value: "monad-testnet"
      - key: CHAIN_EXPLORER
        value: "https://testnet.monadvision.com"
      - key: CHAIN_CONFIRMATIONS
        value: "1"

      # Contracts
      - key: FACTORY_ADDRESS
        sync: false
      - key: MASTER_ADDRESS
        sync: false

      # Wallet
      - key: PRIVATE_KEY
        sync: false

      # Quotas
      - key: DAILY_DEPLOY_QUOTA
        value: "100"
      - key: MIN_GATEWAY_BALANCE_WEI
        value: "50000000000000000"

      # CoinGecko
      - key: COINGECKO_API_KEY
        sync: false

      # Python and logging
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LOG_LEVEL
        value: "INFO"

# ---------------------------------------------------------------------------
# PostgreSQL database (free tier: expires after 90 days, no backups)
# ---------------------------------------------------------------------------
databases:
  - name: gateway-db
    databaseName: gateway
    user: gateway
    plan: free
    region: oregon
